<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/minimalist.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2ldsuHETCiyQHBg3dLEgtmn3zJ7udFvCvDg&s'); /* URL de la imagen */
            background-size: cover;
            background-position: center;
        }
        .blur-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(8px); /* Desenfoque del fondo */
            z-index: -1;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9); /* Fondo semitransparente */
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('togglePassword');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.textContent = 'Ocultar';
            } else {
                passwordInput.type = 'password';
                toggleButton.textContent = 'Mostrar';
            }
        }
    </script>
</head>
<body id="index">
    <div class="blur-overlay"></div>
    <div class="card login-card">
        <div class="card-body">
            <h4 class="card-title text-center mb-4">Sistema Fundación Carlos Stohr</h4>
            <form action="Principal.html" method="GET">
                <button type="submit" id="Boton_Login" class="btn btn-primary w-100" onclick="window.location.href='Principal.html'">Ingresar</button>
            </form>
        </div>
    </div>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="C/Controller_Participantes.js"></script>
</body>
</html>
