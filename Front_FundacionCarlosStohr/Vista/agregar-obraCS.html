    <!-- Main Content -->
    <main class="minimalist-main">
      <!-- Topbar -->
      <header class="minimalist-topbar">
        <div class="user-profile">
          <div class="user-avatar"><i class="bi bi-person"></i></div>
          <span>Usuario Admin</span>
          <i class="bi bi-chevron-down"></i>
        </div>
        <a href="index.html" class="btn-logout">Cerrar Sesión</a>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="page-title mb-0">Agregar Obra de Carlos Stohr</h1>
          <a href="consultar-obraCS.html" class="btn btn-outline-secondary btn-sm" style="border-radius: 8px;">Volver</a>
        </div>

        <section class="section">
          <div class="card border-0 shadow-sm" style="border-radius: 16px;">
            <div class="card-body p-4">

              <!-- Título interno tipo NiceAdmin -->
              <h5 class="card-title fw-bold text-dark mb-4" style="font-size: 1.1rem;"><i class="bi bi-pencil-square text-primary me-2"></i> Datos de la obra</h5>

              <!-- ✅ Form NiceAdmin: row g-3 needs-validation -->
              <form id="form-obra" class="row g-4 needs-validation" novalidate>

                <!-- Numero Obra -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="numero_obra">Número de Obra</label>
                  <input id="numero_obra" class="form-control form-control-mini" type="text" placeholder="Ej: 102, S/N" />
                  <div class="form-text" style="font-size: 12px;">Opcional. Puede ser texto.</div>
                </div>

                <!-- Titulo -->
                <div class="col-md-9">
                  <label class="form-label text-muted fw-semibold" for="titulo">Título <span class="text-danger">*</span></label>
                  <input id="titulo" class="form-control form-control-mini" type="text" required placeholder="Título de la obra" />
                  <div class="invalid-feedback">El título es obligatorio.</div>
                </div>

                <!-- Técnica -->
                <div class="col-md-6">
                  <label class="form-label text-muted fw-semibold" for="tecnica">Técnica</label>
                  <input id="tecnica" class="form-control form-control-mini" type="text" placeholder="Acuarela, óleo, tinta..." />
                </div>

                <!-- Ancho -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="ancho">Ancho</label>
                  <input id="ancho" class="form-control form-control-mini" type="text" inputmode="decimal" placeholder="cm (ej: 23.5 o 23,5)" />
                </div>

                <!-- Alto -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="alto">Alto</label>
                  <input id="alto" class="form-control form-control-mini" type="text" inputmode="decimal" placeholder="cm (ej: 32.5 o 32,5)" />
                </div>

                <!-- Año -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="anio">Año</label>
                  <input id="anio" class="form-control form-control-mini" type="number" inputmode="numeric" placeholder="Ej: 2010" />
                </div>

                <!-- Tema -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="tema">Tema</label>
                  <input id="tema" class="form-control form-control-mini" type="text" placeholder="Tema (opcional)" />
                </div>

                <!-- Estilo -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="estilo">Estilo</label>
                  <input id="estilo" class="form-control form-control-mini" type="text" placeholder="Estilo (opcional)" />
                </div>

                <!-- Ubicacion -->
                <div class="col-md-3">
                  <label class="form-label text-muted fw-semibold" for="ubicacion">Ubicación</label>
                  <input id="ubicacion" class="form-control form-control-mini" type="text" placeholder="Ubicación (opcional)" />
                </div>

                <!-- Observación -->
                <div class="col-12">
                  <label class="form-label text-muted fw-semibold" for="observacion">Observación</label>
                  <textarea id="observacion" class="form-control form-control-mini" rows="3" placeholder="Observaciones (opcional)" style="border-radius: 12px;"></textarea>
                </div>

                <!-- Acciones (igual estilo que paneles: text-center) -->
                <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                  <button id="limpiarObra" class="btn btn-light fw-bold text-secondary" style="border-radius: 8px; padding: 10px 20px;" type="button">
                    Limpiar
                  </button>
                  <button id="agregarObra" class="btn-primary-custom" type="submit" style="border: none;">
                    <span class="cs-btn-text">Guardar Obra</span>
                  </button>
                </div>

              </form>
              <!-- End Form -->

            </div>
          </div>

          <!-- Barra sticky opcional (solo móvil) compatible con tu Controller -->
          <div class="sticky-actions d-md-none">
            <div class="container">
              <div class="d-flex gap-2 justify-content-end">
                <button id="limpiarObraSticky" class="btn btn-secondary" type="button">
                  Limpiar
                </button>
                <button id="agregarObraSticky" class="btn btn-primary" type="button">
                  <span class="cs-btn-text">Guardar</span>
                </button>
              </div>
            </div>
          </div>
