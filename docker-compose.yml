services:
  frontend:
    image: front_fundacioncarlosstohr
    build: ./Front_FundacionCarlosStohr
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - TZ=America/Caracas
    volumes:
      - ./Front_FundacionCarlosStohr:/app
    command: "npx live-server Vista --port=3001 --no-browser --host=0.0.0.0"

  backend:
    image: backend_fundacioncarlosstohr
    build: ./Api_Bd_Carlos_Sthor-
    ports:
      - "3002:3002"
    depends_on:
      - db
    environment:
      - NODE_ENV=develop
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=sc
      - DB_PORT=5432
      - TZ=America/Caracas
      - PGTZ=America/Caracas
    volumes:
      - ./Api_Bd_Carlos_Sthor-:/usr/src
      - /usr/src/node_modules

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=sc
      - TZ=America/Caracas
      - PGTZ=America/Caracas
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./QuerysBD/dump_completo.sql:/docker-entrypoint-initdb.d/dump_completo.sql:ro

volumes:
  postgres_data:
